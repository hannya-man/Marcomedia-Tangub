; Added to the PHP settings on Vercel (vercel-php runtime).
; Vercel's PHP shows errors in the page, and on its PHP 8.4 Laravel 9's libraries raise deprecation
; notices: printed before the page, they stop the login cookie from being set. They go to the log.
display_errors=0
display_startup_errors=0
log_errors=1
error_reporting=E_ALL & ~E_DEPRECATED
